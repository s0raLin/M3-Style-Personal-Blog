name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      # 💡 第一步：安装 pnpm 环境
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8  # 或者使用 latest

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm' 

      - name: Install and Build 🔧
        run: |
          pnpm install
          pnpm run build

      - name: Add .nojekyll 📄
        run: touch docs/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          clean: true
